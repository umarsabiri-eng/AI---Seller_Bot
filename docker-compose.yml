version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-menu-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DB_URI=mongodb://mongo:rm5fem8gjys7nlvi@107.172.58.34:27017/menubot
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      # Mount image directory to persist media files
      - ./image:/app/image:ro
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bot-network:
    driver: bridge

